<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박하나_소개서</title>
  <link rel="stylesheet" href="./과제_소개서.css">
</head>
<body>
  
<div class="wrapper">
    <nav>
      <div class="left">
        <div class="logo">
          <!-- <img src="" alt=""> -->
        </div>
        <p>🐾냥프로필</p>
      </div>
      <div class="right">
        <a href="#pro">프로필</a>
        <a href="#like">좋아하는 것</a>
        <a href="#photo">사진첩</a>
        <a href="#sns">SNS</a>
      </div>
    </nav>

    <header>
      <img src="/resources/images/프로필사진.jpg" alt="프로필 사진">
      <p>고양이 소개서</p>
      <h1>안녕, 나는 방부야!</h1>
      <div class="text">방방 뛰어다니는 멍멍이 냄새 폴폴 나는 냥생 10개월차 고양이.</div>
    </header>

    <main>
      <div class="divider">
        <span>🐾</span>
      </div>

      <section class="section-box" id="pro">
        <h2>프로필</h2>
        <div class="info-card">
          <div class="info-row">
            <span class="label">이름</span>
            <span class="value">박방부</span>
          </div>
          <div class="info-row">
            <span class="label">나이</span>
            <span class="value">10개월</span>
          </div>
          <div class="info-row">
            <span class="label">성별</span>
            <span class="value">남자</span>
          </div>
          <div class="info-row">
            <span class="label">품종</span>
            <span class="value">하일랜드 스트레이트</span>
          </div>
          <div class="info-row">
            <span class="label">성격</span>
            <span class="value">냥이 몸으로 태어난 댕댕이</span>
          </div>
          <div class="info-row">
            <span class="label">특기</span>
            <span class="value">종이공 드리블</span>
          </div>
        </div>
      </section>

      <div class="divider">
        <span>🐾</span>
      </div>

      <section class="section-box" id="like">
        <h2>좋아하는 것</h2>
        <div class="tag-container">
          <div class="tag">🌞 햇볕 낮잠</div>
          <div class="tag">🐔 닭고기트릿</div>
          <div class="tag">⚽ 공놀이</div>
          <div class="tag">📦 상자</div>
          <div class="tag">🧶 실뭉치</div>
        </div>
      </section>

      <div class="divider">
        <span>🐾</span>
      </div>


      <section class="section-box" id="photo">
        <h2>사진첩</h2>
        <div class="gallery-container">
          <div class="photo-card">
            <img src="/resources/images/사진1.jpg" alt="">
          </div>
          <div class="photo-card">
            <img src="/resources/images/사진3.jpg" alt="">
          </div>
          <div class="photo-card">
            <img src="/resources/images/사진2.jpg" alt="">
          </div>
        </div>
      </section>

      <div class="divider">
        <span>🐾</span>
      </div>

      <section class="section-box" id="sns">
        <h2>SNS</h2>
        <div class="sns-container">
          <a href="https://www.instagram.com/parkbangbu?stkn=MWFxejFsMWkxbjNnNA==" class="sns-card" target="_blank">
            <span class="icon">📷</span>
            <div class="sns-info">
              <span class="title">인스타그램</span>
              <span class="sub">@parkbangbu</span>
            </div>
          </a>

          <a href="https://www.youtube.com/@parkbangbu" class="sns-card" target="_blank">
            <span class="icon">▶️</span>
            <div class="sns-info">
              <span class="title">유튜브</span>
              <span class="sub">@parkbangbu</span>
            </div>
          </a>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
